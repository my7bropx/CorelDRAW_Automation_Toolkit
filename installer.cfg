[Application]
name=CorelDRAW Automation Toolkit
version=1.0.0
publisher=CorelDRAW Automation Team
icon=src\resources\icons\app_icon.ico
executable=CorelDRAW_Automation_Toolkit.exe
entry_point=main:main

[Python]
version=3.11.9
bitness=64

[Include]
# Files to include
files =
    dist/CorelDRAW_Automation_Toolkit.exe
    LICENSE.txt

[Install]
# Create Start Menu shortcuts
shortcuts = StartMenu->CorelDRAW Automation Toolkit->CorelDRAW_Automation_Toolkit.exe

# Create Desktop shortcut
desktop_shortcut = CorelDRAW Automation Toolkit

# Installer name
installer_name = CorelDRAW_Automation_Toolkit_Setup_1.0.0.exe
